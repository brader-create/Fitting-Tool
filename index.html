<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brad's Handy Dandy Fitting Tool</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div class="logo-group">
        <svg class="logo-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="20" width="40" height="8" rx="3" fill="currentColor" opacity="0.15"/>
          <rect x="4" y="22" width="40" height="4" rx="2" fill="currentColor" opacity="0.5"/>
          <line x1="12" y1="20" x2="12" y2="26" stroke="currentColor" stroke-width="1.5"/>
          <line x1="20" y1="20" x2="20" y2="28" stroke="currentColor" stroke-width="2"/>
          <line x1="28" y1="20" x2="28" y2="26" stroke="currentColor" stroke-width="1.5"/>
          <line x1="36" y1="20" x2="36" y2="28" stroke="currentColor" stroke-width="2"/>
          <path d="M30 8 C35 8 39 12 39 17 C39 19 38 21 36.5 22.5 L26 33 C25 34 23.5 34 22.5 33 L21 31.5 C20 30.5 20 29 21 28 L31.5 17.5 C33 16 33 14 31.5 12.5 C30 11 28 11 26.5 12.5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/>
          <circle cx="23" cy="32" r="1.5" fill="currentColor"/>
        </svg>
        <h1 class="logo-text">Brad's Handy Dandy Fitting Tool</h1>
      </div>
      <button id="themeToggle" class="btn btn-theme" title="Toggle theme">
        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
    </div>
  </header>

  <!-- Hero / Search Panel -->
  <section class="hero">
    <div class="hero-inner">

      <!-- Step 1: Appliance type -->
      <div class="step-block">
        <div class="step-label">Appliance type</div>
        <div class="type-pills" id="typePills">
          <!-- built by JS from data -->
        </div>
      </div>

      <!-- Step 2: Cutout dimensions -->
      <div class="step-block">
        <div class="step-label">Cutout dimensions <span class="step-hint">(inches)</span></div>
        <div class="dimension-inputs">
          <div class="dim-field">
            <label for="filterWidth">Width</label>
            <div class="dim-input-wrap">
              <input type="number" id="filterWidth" class="dim-input" placeholder="e.g. 34.75" step="0.125">
              <span class="dim-unit">in</span>
            </div>
          </div>
          <div class="dim-sep">×</div>
          <div class="dim-field">
            <label for="filterHeight">Height</label>
            <div class="dim-input-wrap">
              <input type="number" id="filterHeight" class="dim-input" placeholder="optional" step="0.125">
              <span class="dim-unit">in</span>
            </div>
          </div>
          <div class="dim-sep">×</div>
          <div class="dim-field">
            <label for="filterDepth">Depth</label>
            <div class="dim-input-wrap">
              <input type="number" id="filterDepth" class="dim-input" placeholder="optional" step="0.125">
              <span class="dim-unit">in</span>
            </div>
          </div>
        </div>
        <div class="tolerance-row">
          <label for="fitTolerance" class="tol-label">Fit tolerance</label>
          <input type="range" id="fitTolerance" min="0.125" max="2" step="0.125" value="0.5">
          <span id="fitToleranceVal" class="tol-val">± 0.5"</span>
        </div>
      </div>

      <!-- Search + filters -->
      <div class="search-row">
        <div class="search-wrap">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" id="searchInput" class="search-input" placeholder="Search model number or brand…">
        </div>
        <button id="filtersToggleBtn" class="btn btn-secondary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
          Filters
        </button>
      </div>

      <!-- Collapsible filters -->
      <div id="filtersPanel" class="filters-panel" style="display:none;">
        <div class="filters-grid">
          <div class="filter-group">
            <div class="filter-group-label">Brand</div>
            <div class="filter-list" id="brandFilters"></div>
          </div>
          <div class="filter-group">
            <div class="filter-group-label">Nominal Size</div>
            <div class="filter-list" id="nominalSizeFilters"></div>
          </div>
          <div class="filter-group">
            <div class="filter-group-label">Install Type</div>
            <div class="filter-list" id="installFilters"></div>
          </div>
          <div class="filter-group">
            <div class="filter-group-label">Status</div>
            <label class="toggle-label">
              <input type="checkbox" id="filterActive" checked>
              <span class="toggle-switch"></span>
              Active only
            </label>
          </div>
          <div class="filter-group">
            <div class="filter-group-label">Sort by</div>
            <select id="sortBy" class="input input-sm">
              <option value="fit">Best Fit</option>
              <option value="brand">Brand</option>
              <option value="model">Model Number</option>
              <option value="nominalSize">Nominal Size</option>
              <option value="width">Width</option>
            </select>
          </div>
        </div>
        <button id="clearFiltersBtn" class="btn-clear-filters">Clear all filters</button>
      </div>

    </div>
  </section>

  <!-- Results -->
  <main class="results-section">
    <div class="results-inner">

      <div class="results-meta" id="resultsMeta" style="display:none;">
        <div class="results-count">Showing <strong id="showingModels">0</strong> of <strong id="totalModels">0</strong> models</div>
        <div class="fit-legend" id="fitLegend" style="display:none;">
          <span class="legend-dot green"></span> Fits
          <span class="legend-dot orange"></span> Very close
          <span class="legend-dot none"></span> Within tolerance
        </div>
      </div>

      <div class="model-grid" id="modelGrid"></div>

      <div class="no-results" id="noResults" style="display:none;">
        <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <p>No models match your search.</p>
        <p class="hint-text">Try widening the tolerance or adjusting your dimensions.</p>
      </div>

    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
